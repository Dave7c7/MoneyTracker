name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_USER: moneytracker
  POSTGRES_PASSWORD: moneytracker
  DATABASE_URL: postgresql://moneytracker:moneytracker@localhost:5432/moneytracker
  TEST_DATABASE_URL: postgresql://moneytracker:moneytracker@localhost:5432/moneytracker_test
  E2E_DATABASE_URL: postgresql://moneytracker:moneytracker@localhost:5432/moneytracker_e2e
  ADAPTER_ID: mock
  APP_TIMEZONE: America/Los_Angeles
  REVIEW_CONFIDENCE_THRESHOLD: '0.8'

jobs:
  check:
    name: Test, lint, typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: moneytracker
          POSTGRES_PASSWORD: moneytracker
          POSTGRES_DB: moneytracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moneytracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The runner's newest pg_dump writes SET transaction_timeout, which this
      # PostgreSQL 16 server cannot restore. Use matching client and server majors.
      - name: Install PostgreSQL 16 client tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          codename="$(. /etc/os-release && echo "$VERSION_CODENAME")"
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${codename}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      # Nothing to create: `pnpm test` makes and migrates its own database, and
      # the lock in it stops two runs sharing one.
      #
      # `pnpm check` also runs Prettier and the migration guard, so a schema
      # edit without its generated migration fails here rather than on the
      # next fresh database.
      - name: Test, lint, typecheck, format, migrations
        run: pnpm check

  e2e:
    name: Playwright end-to-end
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: moneytracker
          POSTGRES_PASSWORD: moneytracker
          POSTGRES_DB: moneytracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moneytracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run the end-to-end suite
        run: pnpm e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
